name: Profile Automation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-automation
  cancel-in-progress: false

jobs:
  # ---------------- snake  (independent) ----------------
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bf94ff&color_dots=#161032,#4c1d95,#6d28d9,#8b5cf6,#bf94ff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------- 3D graph  (independent) ----------------
  contrib3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # optional: add a PAT secret named PROFILE_TOKEN to also count private work
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit 3D graphs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: update 3D contribution graph"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

  # ---------------- summary cards  (runs after 3D, but even if 3D fails) ----------------
  cards:
    runs-on: ubuntu-latest
    needs: contrib3d
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
