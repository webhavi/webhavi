<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="presentation">
<defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#bf94ff"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.tw{animation:tw 4s ease-in-out infinite;opacity:.15}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
.nd{animation:nd 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes nd{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
</style>
<line x1="40" y1="22" x2="1160" y2="22" stroke="url(#fade)" stroke-width="1.5"/>
<g class="nd" style="animation-delay:0.7s"><circle cx="120" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="120" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:1.6s"><circle cx="240" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="240" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:1.1s"><circle cx="360" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="360" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:1.8s"><circle cx="480" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="480" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:1.9s"><circle cx="600" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="600" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:0.2s"><circle cx="720" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="720" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:0.0s"><circle cx="840" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="840" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:2.5s"><circle cx="960" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="960" cy="22" r="1.6" fill="#22d3ee"/></g><g class="nd" style="animation-delay:0.8s"><circle cx="1080" cy="22" r="4" fill="#0d0a1f" stroke="#bf94ff" stroke-width="1.3"/><circle cx="1080" cy="22" r="1.6" fill="#22d3ee"/></g>
<circle r="3.4" cy="22" fill="#22d3ee" filter="url(#glow)"><animate attributeName="cx" values="40;1160" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>