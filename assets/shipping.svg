<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d1a"/><stop offset="1" stop-color="#150d2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".6"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="338" rx="18" fill="url(#bg)" stroke="url(#bd)" stroke-width="1.5"/>

  <!-- window dots + title -->
  <circle cx="30" cy="30" r="5" fill="#f472b6"/><circle cx="48" cy="30" r="5" fill="#fbbf24"/><circle cx="66" cy="30" r="5" fill="#34d399"/>
  <text x="90" y="34" font-size="12" fill="#6b5b95">~/webhavi/shipping.log</text>
  <text x="870" y="34" font-size="12" fill="#bf94ff" text-anchor="end" font-weight="700">// CURRENTLY SHIPPING
    <animate attributeName="opacity" values="1;.55;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <line x1="24" y1="50" x2="876" y2="50" stroke="#2a1f4d"/>

  <!-- ROW 1 -->
  <g>
    <circle cx="44" cy="92" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="64" y="90" font-size="16" font-weight="700" fill="#f3e8ff">LLM Fine-tuning Pipeline</text>
    <text x="64" y="110" font-size="11" fill="#8f7fc0">PyTorch · HuggingFace · LoRA</text>
    <rect x="520" y="86" width="200" height="8" rx="4" fill="#1d1540"/>
    <rect x="520" y="86" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" from="0" to="156" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect>
    <text x="730" y="95" font-size="11" fill="#bf94ff">78%</text>
    <rect x="780" y="76" width="96" height="26" rx="13" fill="#34d3991a" stroke="#34d399"/>
    <text x="828" y="93" font-size="11" fill="#34d399" text-anchor="middle" font-weight="700">ACTIVE</text>
  </g>

  <!-- ROW 2 -->
  <g>
    <circle cx="44" cy="155" r="5" fill="#fbbf24"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="64" y="153" font-size="16" font-weight="700" fill="#f3e8ff">Vision Transformer Research</text>
    <text x="64" y="173" font-size="11" fill="#8f7fc0">ViT · CLIP · OpenCV</text>
    <rect x="520" y="149" width="200" height="8" rx="4" fill="#1d1540"/>
    <rect x="520" y="149" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" from="0" to="90" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect>
    <text x="730" y="158" font-size="11" fill="#bf94ff">45%</text>
    <rect x="780" y="139" width="96" height="26" rx="13" fill="#fbbf241a" stroke="#fbbf24"/>
    <text x="828" y="156" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700">WIP</text>
  </g>

  <!-- ROW 3 -->
  <g>
    <circle cx="44" cy="218" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <text x="64" y="216" font-size="16" font-weight="700" fill="#f3e8ff">AI Agent Framework</text>
    <text x="64" y="236" font-size="11" fill="#8f7fc0">LangChain · FastAPI · Redis</text>
    <rect x="520" y="212" width="200" height="8" rx="4" fill="#1d1540"/>
    <rect x="520" y="212" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" from="0" to="144" dur="1.6s" begin="0.8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect>
    <text x="730" y="221" font-size="11" fill="#bf94ff">72%</text>
    <rect x="780" y="202" width="96" height="26" rx="13" fill="#34d3991a" stroke="#34d399"/>
    <text x="828" y="219" font-size="11" fill="#34d399" text-anchor="middle" font-weight="700">ACTIVE</text>
  </g>

  <!-- ROW 4 -->
  <g>
    <circle cx="44" cy="281" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <text x="64" y="279" font-size="16" font-weight="700" fill="#f3e8ff">ML Monitoring Dashboard</text>
    <text x="64" y="299" font-size="11" fill="#8f7fc0">MLflow · Grafana · Docker</text>
    <rect x="520" y="275" width="200" height="8" rx="4" fill="#1d1540"/>
    <rect x="520" y="275" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" from="0" to="120" dur="1.6s" begin="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></rect>
    <text x="730" y="284" font-size="11" fill="#bf94ff">60%</text>
    <rect x="780" y="265" width="96" height="26" rx="13" fill="#22d3ee1a" stroke="#22d3ee"/>
    <text x="828" y="282" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="700">BETA</text>
  </g>
</svg>
